# ===================================================================
# Pillai System - Application Configuration
# ===================================================================

spring.application.name=Pillai System
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (MySQL 8+)
# Adjust DB_USERNAME and DB_PASSWORD environment variables or update here
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pillai_system_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:yash123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# JWT Configuration
# -------------------------------------------------------------------
pillai.app.jwtSecret=PillaiSystemSecretKeyForJWTSecurityAuthenticationSignature1234567890987654321
pillai.app.jwtExpirationMs=86400000

# -------------------------------------------------------------------
# Static Resource Handling (Frontend Dashboard)
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.pillai.system=INFO
