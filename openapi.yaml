                    studentNumber: "STU001"
                    studentName: "Aarav Patel"
                    subjectId: 1
                    subjectCode: "CS101"
                    subjectName: "Data Structures & Algorithms"
                    marks: 85.0
                    maxMarks: 100.0
                    percentage: 85.0
                    semester: "Semester 1"
                    examType: "Midterm Examination"
                    grade: "A"
                    remarks: "Good performance"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Results
      summary: Enter Student Examination Marks & Auto-Calculate Grade
      description: |
        Submits student examination marks for an exam session.
        Validates that `0 <= marks <= maxMarks`.
        Computes `percentage = (marks / maxMarks) * 100` and automatically maps the score to the institutional grading scale (`A+`, `A`, `B+`, `B`, `C`, `D`, `F`) via `GradingService`.
        Authorized for `ROLE_ADMIN` and `ROLE_TEACHER`.
      operationId: enterMarks
      security:
        - bearerAuth: []
      requestBody:
        description: Examination marks entry payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultRequestDto'
            example:
              studentId: 1
              subjectId: 1
              marks: 92.5
              maxMarks: 100.0
              semester: "Semester 1"
              examType: "Final Examination"
              remarks: "Outstanding conceptual clarity"
      responses:
        '201':
          description: Marks registered and letter grade assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseResult'
              example:
                success: true
                message: "Student marks entered successfully"
                data:
                  id: 21
                  studentId: 1
                  studentNumber: "STU001"
                  studentName: "Aarav Patel"
                  subjectId: 1
                  subjectCode: "CS101"
                  subjectName: "Data Structures & Algorithms"
                  marks: 92.5
                  maxMarks: 100.0
                  percentage: 92.5
                  semester: "Semester 1"
                  examType: "Final Examination"
                  grade: "A+"
                  remarks: "Outstanding conceptual clarity"
        '400':
          description: Validation error or invalid marks range (`marks > maxMarks` or negative marks).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Student or Subject ID not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

