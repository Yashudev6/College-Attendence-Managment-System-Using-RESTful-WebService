  # =========================================================================
  # 7. ATTENDANCE CONTROLLER (/api/attendance)
  # =========================================================================
  /api/attendance:
    get:
      tags:
        - Attendance
      summary: Retrieve All Attendance Records
      description: |
        Fetches the complete historical attendance log across all students and subjects.
        Requires authenticated session.
      operationId: getAllAttendance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Attendance log retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAttendanceList'
              example:
                success: true
                message: "Attendance records retrieved successfully"
                data:
                  - id: 1
                    studentId: 1
                    studentNumber: "STU001"
                    studentName: "Aarav Patel"
                    subjectId: 1
                    subjectCode: "CS101"
                    subjectName: "Data Structures & Algorithms"
                    date: "2026-08-28"
                    status: "PRESENT"
                    remarks: "Present in lecture"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Attendance
      summary: Mark Student Attendance
      description: |
        Records attendance for a student in a specific subject on a designated calendar date.
        Enforces a strict unique constraint on `(student_id, subject_id, date)`.
        If an attendance entry already exists for that combination, a `409 Conflict` is returned.
        Authorized for `ROLE_ADMIN` and `ROLE_TEACHER`.
      operationId: markAttendance
      security:
        - bearerAuth: []
      requestBody:
        description: Attendance record submission.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequestDto'
            example:
              studentId: 1
              subjectId: 1
              date: "2026-09-07"
              status: "PRESENT"
              remarks: "Attended laboratory session"
      responses:
        '201':
          description: Attendance marked successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAttendance'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Conflict. Attendance already recorded for this student, subject, and date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-07T18:14:00"
                status: 409
                message: "Attendance already marked for this student, subject, and date: 2026-09-07"
                path: "/api/attendance"

  /api/attendance/{id}:
    get:
      tags:
        - Attendance
      summary: Get Attendance Record by ID
      description: |
        Retrieves a single attendance entry by its database primary key.
        Requires authenticated session.
      operationId: getAttendanceById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Attendance database primary key ID.
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Attendance record retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAttendance'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Attendance
      summary: Full Update of Attendance Record
      description: |
        Performs a full update of an existing attendance record (re-assigns date, status, subject, or student).
        Authorized for `ROLE_ADMIN` and `ROLE_TEACHER`.
      operationId: updateAttendance
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Attendance database primary key ID.
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        description: Updated attendance parameters.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequestDto'
            example:
              studentId: 1
              subjectId: 1
              date: "2026-09-07"
              status: "LATE"
              remarks: "Arrived 15 minutes late"
      responses:
        '200':
          description: Attendance updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAttendance'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags:
