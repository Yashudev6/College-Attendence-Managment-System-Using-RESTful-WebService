# ===========================================================================
# COMPONENTS SECTION: SCHEMAS, RESPONSES, SECURITY SCHEMES
# ===========================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HMAC SHA-256 signed JSON Web Token (JWT).
        Obtain a token via `POST /api/auth/login` or `POST /api/auth/register`.
        Include in HTTP headers as: `Authorization: Bearer <token>`

  responses:
    BadRequestError:
      description: Bad Request. Input validation failed or malformed request payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-07T18:14:00"
            status: 400
            message: "Validation failed: Field cannot be blank"
            path: "/api/resource"

    UnauthorizedError:
      description: Unauthorized. Missing, invalid, or expired Bearer JWT token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-07T18:14:00"
            status: 401
            message: "Unauthorized access: Please provide a valid Bearer token"
            path: "/api/resource"

    ForbiddenError:
      description: Forbidden. Authenticated user does not possess the required RBAC role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-07T18:14:00"
            status: 403
            message: "Access denied: insufficient permissions"
            path: "/api/resource"

    NotFoundError:
      description: Not Found. The requested entity ID does not exist in the database.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-07T18:14:00"
            status: 404
            message: "Resource not found with id: 999"
            path: "/api/resource/999"

  schemas:
    # -----------------------------------------------------------------------
    # Enums
    # -----------------------------------------------------------------------
    Role:
      type: string
      description: Institutional Role-Based Access Control (RBAC) security level.
      enum:
        - ADMIN
        - TEACHER
        - STUDENT
      example: "ADMIN"

    AttendanceStatus:
      type: string
      description: Daily student attendance status classification.
      enum:
        - PRESENT
        - ABSENT
        - LATE
      example: "PRESENT"

    # -----------------------------------------------------------------------
    # Core DTO Schemas
    # -----------------------------------------------------------------------
    AuthRequest:
      type: object
      description: User credentials submitted to initiate session.
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Unique system username.
          example: "admin"
        password:
          type: string
          format: password
          description: Cleartext password to authenticate against stored BCrypt hash.
          example: "admin123"

    AuthResponse:
      type: object
      description: Authentication payload returned upon successful login or registration.
      properties:
        token:
          type: string
          description: Signed HMAC SHA-256 JSON Web Token.
          example: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbiIsImlhdCI6MTY5NDA3MjAwMCwiZXhwIjoxNjk0MTU4NDAwfQ.somerandomsignaturestring"
        tokenType:
          type: string
          description: Authentication scheme.
          default: "Bearer"
          example: "Bearer"
        userId:
          type: integer
          format: int64
          description: Primary key ID in `users` table.
          example: 1
        username:
          type: string
          description: Username of authenticated principal.
          example: "admin"
        email:
          type: string
          format: email
          description: Registered email address.
          example: "admin@pillai.edu"
        role:
          $ref: '#/components/schemas/Role'
        entityId:
          type: integer
          format: int64
          description: Database primary key ID of the associated profile entity (Student ID, Teacher ID, or Admin ID).
          example: 1
        name:
          type: string
          description: Display name of the user.
          example: "System Administrator"

    RegisterRequest:
      type: object
      description: Comprehensive registration payload for provisioning new users and associated profile entities.
      required:
        - username
        - email
        - password
        - role
        - name
      properties:
        username:
          type: string
          description: Unique login username.
          example: "student11"
        email:
          type: string
          format: email
          description: Unique contact and login email address.
          example: "student11@pillai.edu"
        password:
          type: string
          format: password
          description: Account password (will be hashed with BCrypt before persistence).
          example: "student123"
        role:
          $ref: '#/components/schemas/Role'
        name:
          type: string
          description: Full legal name.
          example: "Tanvi Sharma"
        phone:
          type: string
          description: Contact telephone number.
          example: "+91 99000 10011"
        departmentId:
          type: integer
          format: int64
          description: Database ID of the affiliated department (applicable for students and teachers).
          example: 1
        classId:
          type: integer
          format: int64
          description: Database ID of the academic class cohort (applicable for students).
          example: 1
        teacherIdStr:
          type: string
          description: Custom institutional teacher identification code (e.g., TCH003).
          example: "TCH003"
        studentIdStr:
          type: string
          description: Custom institutional student enrollment code (e.g., STU011).
          example: "STU011"
        dateOfBirth:
          type: string
          format: date
          description: Date of birth (YYYY-MM-DD).
          example: "2003-05-14"
        gender:
          type: string
          description: Gender identifier.
          example: "Female"
        address:
          type: string
          description: Residential mailing address.
          example: "Sector 15, Panvel, Navi Mumbai"

    StudentDto:
      type: object
      description: Student entity data transfer representation.
      required:
        - studentId
        - name
        - email
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Unique auto-increment primary key ID in `students` table.
          example: 1
        studentId:
          type: string
          description: Institutional student identifier code.
          example: "STU001"
        name:
          type: string
          description: Full name of student.
          example: "Aarav Patel"
        email:
          type: string
          format: email
          description: Email address (synchronized with login account).
          example: "student1@pillai.edu"
        phone:
          type: string
          description: Mobile contact number.
          example: "+91 99000 10000"
        dateOfBirth:
          type: string
          format: date
          description: Student birthdate.
          example: "2002-01-10"
        gender:
          type: string
          description: Gender (Male / Female / Other).
          example: "Male"
        address:
          type: string
          description: Full residential address.
          example: "Navi Mumbai, Maharashtra, India"
        classId:
          type: integer
          format: int64
          description: Foreign key ID referencing `classes` table.
          example: 1
        className:
          type: string
          readOnly: true
          description: Name of enrolled class.
          example: "CS-Sem1"
        departmentId:
          type: integer
          format: int64
          description: Foreign key ID referencing `departments` table.
          example: 1
        departmentName:
          type: string
          readOnly: true
          description: Name of academic department.
