          type: integer
          format: int64
          description: Student database primary key ID.
          example: 1
        studentNumber:
          type: string
          description: Institutional student code.
          example: "STU001"
        studentName:
          type: string
          description: Student full name.
          example: "Aarav Patel"
        className:
          type: string
          description: Enrolled class cohort name.
          example: "CS-Sem1"
        totalClasses:
          type: integer
          format: int64
          description: Total number of sessions logged for student.
          example: 10
        presentCount:
          type: integer
          format: int64
          description: Sessions marked as PRESENT.
          example: 9
        absentCount:
          type: integer
          format: int64
          description: Sessions marked as ABSENT.
          example: 1
        lateCount:
          type: integer
          format: int64
          description: Sessions marked as LATE.
          example: 0
        attendancePercentage:
          type: number
          format: double
          description: Percentage of sessions attended: `(presentCount / totalClasses) * 100`.
          example: 90.0
        lowAttendance:
          type: boolean
          description: True if attendance percentage is strictly below institutional threshold (75.0%).
          example: false

