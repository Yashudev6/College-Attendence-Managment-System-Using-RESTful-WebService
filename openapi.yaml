    # -----------------------------------------------------------------------
    # Standard Error Model
    # -----------------------------------------------------------------------
    ErrorResponse:
      type: object
      description: Standardized error payload generated by `GlobalExceptionHandler`.
      required:
        - timestamp
        - status
        - message
        - path
      properties:
        timestamp:
          type: string
          description: Timestamp of error generation in ISO-8601 string format.
          example: "2026-09-07T18:14:00"
        status:
          type: integer
          description: HTTP status code.
          example: 400
        message:
          type: string
          description: Descriptive message explaining cause of error.
          example: "Validation failed: Student ID is required"
        path:
          type: string
          description: API URI request path that triggered the exception.
          example: "/api/students"

