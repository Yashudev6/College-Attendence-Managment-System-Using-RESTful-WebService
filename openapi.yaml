          format: double
          minimum: 0
          description: Adjusted marks obtained.
          example: 78.5
        maxMarks:
          type: number
          format: double
          minimum: 1
          description: Adjusted maximum marks.
          example: 100.0
        remarks:
          type: string
          description: Updated faculty remarks.
          example: "Re-evaluated after question paper grievance"

    StudentResultSummaryDto:
