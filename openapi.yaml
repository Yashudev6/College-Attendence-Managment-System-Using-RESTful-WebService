        subjectCode:
          type: string
          readOnly: true
          description: Subject course code.
          example: "CS101"
        subjectName:
          type: string
          readOnly: true
          description: Subject title.
          example: "Data Structures & Algorithms"
        marks:
          type: number
          format: double
          description: Marks scored by the student.
          example: 85.0
        maxMarks:
          type: number
          format: double
          description: Maximum possible marks for the evaluation.
          example: 100.0
        percentage:
          type: number
          format: double
          description: Computed percentage: `(marks / maxMarks) * 100`.
          example: 85.0
        semester:
          type: string
          description: Semester term designation.
          example: "Semester 1"
        examType:
          type: string
          description: Examination category (e.g., Midterm Examination, Final Examination, Unit Test).
          example: "Midterm Examination"
        grade:
          type: string
          readOnly: true
          description: Automated letter grade derived via `GradingService` (A+, A, B+, B, C, D, F).
          example: "A"
        remarks:
          type: string
          description: Faculty evaluation remarks.
          example: "Good performance"

    ResultRequestDto:
      type: object
      description: Request payload for recording examination marks.
      required:
        - studentId
        - subjectId
        - marks
        - maxMarks
        - semester
        - examType
      properties:
        id:
          type: integer
          format: int64
          description: Optional ID when updating an existing record.
          example: 1
        studentId:
          type: integer
          format: int64
          description: Target student primary key ID.
          example: 1
        subjectId:
          type: integer
          format: int64
          description: Target subject primary key ID.
          example: 1
        marks:
          type: number
          format: double
          minimum: 0
          description: Marks scored (cannot be negative).
          example: 92.5
        maxMarks:
          type: number
          format: double
          minimum: 1
          description: Total maximum marks available (must be greater than 0).
          example: 100.0
        semester:
          type: string
          description: Academic semester.
          example: "Semester 1"
        examType:
          type: string
          description: Examination assessment label.
          example: "Final Examination"
        remarks:
          type: string
          description: Optional feedback comments.
          example: "Outstanding performance in algorithms"

