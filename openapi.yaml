      operationId: getAllResults
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Examination results retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseResultList'
              example:
                success: true
                message: "Result records retrieved successfully"
                data:
                  - id: 1
