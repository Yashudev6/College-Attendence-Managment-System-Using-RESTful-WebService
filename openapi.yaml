      description: Cumulative academic transcript summary aggregating all examinations for a student.
      properties:
        studentId:
          type: integer
          format: int64
          description: Student database primary key ID.
          example: 1
        studentNumber:
          type: string
          description: Student institutional enrollment code.
          example: "STU001"
        studentName:
          type: string
          description: Student full name.
          example: "Aarav Patel"
        className:
          type: string
          description: Enrolled class cohort name.
          example: "CS-Sem1"
        totalMarks:
          type: number
          format: double
          description: Sum of all marks obtained across all examinations.
          example: 177.0
        totalMaxMarks:
          type: number
          format: double
          description: Sum of all maximum possible marks.
          example: 200.0
        overallPercentage:
          type: number
          format: double
          description: Cumulative aggregate percentage: `(totalMarks / totalMaxMarks) * 100`.
