openapi: 3.0.3
info:
  title: Pillai System REST API Specification
  description: |
    # Pillai System - Enterprise Student Attendance & Result Management API

    Welcome to the official, code-oriented **OpenAPI 3.0.3 specification** for the **Pillai System**.
    This document provides an exhaustive, human-crafted architectural and technical reference for all RESTful endpoints, DTO models, entity schemas, validation constraints, and security definitions implemented in the backend application.

    ---

    ## Architectural Overview
    * **Runtime & Framework**: Java 17 LTS / Spring Boot 3.2.3
    * **Security Framework**: Spring Security 6 with stateless HMAC SHA-256 JWT Bearer Authentication (`JwtAuthenticationFilter`)
    * **Persistence Layer**: Spring Data JPA & Hibernate 6 with MySQL 8.0+ transactional database
    * **Data Transfer Protocol**: JSON over HTTP/1.1 (RESTful JSON APIs)
    * **Standard Response Envelope**: All API endpoints wrap responses in a standardized `ApiResponse<T>` envelope:
      ```json
      {
        "success": true,
        "message": "Operation executed successfully",
        "data": { ... }
      }
      ```
    * **Standard Error Model**: Intercepted by `GlobalExceptionHandler` (`@RestControllerAdvice`), returning an `ErrorResponse`:
      ```json
      {
        "timestamp": "2026-09-07T18:30:00",
        "status": 400,
        "message": "Validation failed: Student ID is required",
        "path": "/api/students"
      }
      ```

    ---

    ## Role-Based Access Control (RBAC)
    The system supports three granular roles defined in `com.pillai.system.entity.Role`:
    1. **`ROLE_ADMIN`**: Unrestricted governance over students, teachers, departments, academic classes, curriculum subjects, user accounts, and dashboard analytics.
    2. **`ROLE_TEACHER`**: Authorized to mark and update student attendance, enter examination marks, evaluate student results, and view curriculum schedules.
    3. **`ROLE_STUDENT`**: Read-only personal access to view enrolled classes, class subjects, attendance records, attendance summary percentages, and examination transcripts.

    ---

    ## Grading Engine Logic (`GradingService`)
    The examination results engine automatically derives letter grades based on percentage computation:
    $$\text{Percentage} = \left(\frac{\text{Marks Obtained}}{\text{Max Marks}}\right) \times 100$$
    * **90.0% – 100.0%**: Grade **`A+`** (Outstanding)
    * **80.0% – 89.99%**: Grade **`A`** (Excellent)
    * **70.0% – 79.99%**: Grade **`B+`** (Very Good)
    * **60.0% – 69.99%**: Grade **`B`** (Good)
    * **50.0% – 59.99%**: Grade **`C`** (Average)
    * **40.0% – 49.99%**: Grade **`D`** (Pass)
    * **Below 40.0%**: Grade **`F`** (Fail)

    ---

    ## Attendance Threshold Engine (`AttendanceService`)
    * **Low Attendance Criterion**: The system tracks attendance percentage:
      $$\text{Attendance Percentage} = \left(\frac{\text{Present Days}}{\text{Total Sessions}}\right) \times 100$$
    * Any student falling strictly below **75.0%** is flagged with `lowAttendance: true` and surfaced in executive dashboard alerts (`GET /api/attendance/low-attendance`).
    * **Duplicate Prevention**: A unique database constraint on `(student_id, subject_id, date)` prohibits duplicate attendance entries for the same student, subject, and calendar day.

    ---

    ## Authentication Workflow
    1. Submit credentials to `POST /api/auth/login`.
    2. On success, the response contains a 24-hour HMAC SHA-256 signed `token`.
    3. For all protected resources, pass the HTTP Authorization header:
       `Authorization: Bearer <your_jwt_token>`
  version: 1.0.0
  contact:
    name: Pillai System Technical Architecture Team
    email: admin@pillai.edu
    url: https://pillai.edu
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local Spring Boot Development Server
  - url: https://api.pillai.edu/v1
    description: Production Enterprise API Gateway

tags:
  - name: Authentication
    description: Public authentication, user registration, JWT generation, and logout operations.
  - name: Students
    description: Student lifecycle management, enrollment queries, class roster lookups, and student self-profile.
  - name: Teachers
    description: Faculty directory management, teacher onboarding, departmental alignments, and profile updates.
  - name: Departments
    description: Academic department governance, curriculum divisions, and institutional structure.
  - name: Classes
    description: Academic cohorts, semester classifications, and class enrollment mappings.
  - name: Subjects
    description: Academic subjects/courses, credit weight allocations, and faculty teaching assignments.
  - name: Attendance
    description: Daily session attendance recording, duplicate prevention, status patching, and low attendance analytics (<75%).
  - name: Results
    description: Examination marks entry, automated letter grade calculations, grade revisions, and cumulative student transcripts.
  - name: Users
    description: Administrative user account directory, RBAC credential governance, and login access activation/deactivation.
  - name: Dashboard
    description: Institutional KPIs, student-teacher ratios, aggregate metrics, and administrative alert telemetry.

paths:
  # =========================================================================
  # 1. AUTHENTICATION CONTROLLER (/api/auth)
  # =========================================================================
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User Authentication & JWT Issuance
      description: |
        Authenticates a user against the Spring Security `DaoAuthenticationProvider`.
        Validates username and BCrypt-hashed password.
        Returns an HMAC SHA-256 signed JSON Web Token (valid for 24 hours), user identity metadata, and assigned RBAC role (`ADMIN`, `TEACHER`, or `STUDENT`).
      operationId: login
      security: []
      requestBody:
        description: Authentication credentials payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            example:
              username: "admin"
              password: "admin123"
      responses:
        '200':
          description: Authentication successful. JWT token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuth'
              example:
                success: true
                message: "Login successful"
                data:
                  token: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbiIsImlhdCI6MTY5NDA3MjAwMCwiZXhwIjoxNjk0MTU4NDAwfQ.somerandomsignaturestring"
                  tokenType: "Bearer"
                  userId: 1
                  username: "admin"
                  email: "admin@pillai.edu"
                  role: "ADMIN"
                  entityId: 1
                  name: "System Administrator"
        '400':
          description: Bad request. Request validation failed (blank username or password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-07T18:14:00"
                status: 400
                message: "Validation failed: Username is required; Password is required"
                path: "/api/auth/login"
        '401':
          description: Unauthorized. Invalid username or incorrect password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-07T18:14:00"
                status: 401
                message: "Invalid username or password"
                path: "/api/auth/login"

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register New User & Associated Entity
      description: |
        Registers a new user account with BCrypt password encryption and automatically creates the corresponding role-based profile entity:
        * If `role == STUDENT`: Creates a new `Student` record linked to `classId` and `departmentId`.
        * If `role == TEACHER`: Creates a new `Teacher` record linked to `departmentId`.
        * If `role == ADMIN`: Creates a new `Admin` record.
        Enforces uniqueness on username and email addresses. Returns a JWT token upon successful onboarding.
      operationId: register
      security: []
      requestBody:
        description: Comprehensive user registration payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: "student11"
              email: "student11@pillai.edu"
              password: "student123"
              role: "STUDENT"
              name: "Tanvi Sharma"
              phone: "+91 99000 10011"
              departmentId: 1
              classId: 1
              studentIdStr: "STU011"
              dateOfBirth: "2003-05-14"
              gender: "Female"
              address: "Sector 15, Panvel, Navi Mumbai"
      responses:
        '201':
          description: User and entity record successfully registered and provisioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuth'
              example:
                success: true
                message: "User registered successfully"
                data:
                  token: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJzdHVkZW50MTEiLCJpYXQiOjE2OTQwNzIwMDAsImV4cCI6MTY5NDE1ODQwMH0.somerandomsignaturestring"
                  tokenType: "Bearer"
                  userId: 15
                  username: "student11"
                  email: "student11@pillai.edu"
                  role: "STUDENT"
                  entityId: 11
                  name: "Tanvi Sharma"
        '400':
          description: Validation error in submitted registration details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict. Username or email already registered in system.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-07T18:14:00"
                status: 409
                message: "Username already exists: student11"
                path: "/api/auth/register"

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Terminate User Session
      description: |
        Signals logout on the server. Because the application uses stateless JWT authentication, the client application must remove the stored JWT token from browser `localStorage`.
      operationId: logout
      security: []
      responses:
        '200':
          description: Successfully acknowledged logout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseString'
              example:
                success: true
                message: "Logged out successfully"
                data: null

  # =========================================================================
  # 2. STUDENT CONTROLLER (/api/students)
  # =========================================================================
  /api/students:
    get:
      tags:
        - Students
      summary: Retrieve All Students or Search Directory
      description: |
        Fetches a list of all enrolled students.
        Supports optional substring search across student name, custom student ID (`studentId`), or email address via the `search` query parameter.
        Requires authenticated user (`ROLE_ADMIN`, `ROLE_TEACHER`, or `ROLE_STUDENT`).
      operationId: getAllStudents
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Substring query to filter students by name, student number, or email address.
          schema:
            type: string
          example: "Aarav"
      responses:
        '200':
          description: Student list retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStudentList'
              example:
                success: true
                message: "Students retrieved successfully"
                data:
                  - id: 1
                    studentId: "STU001"
                    name: "Aarav Patel"
                    email: "student1@pillai.edu"
                    phone: "+91 99000 10000"
                    dateOfBirth: "2002-01-10"
                    gender: "Male"
                    address: "Navi Mumbai, Maharashtra, India"
                    classId: 1
                    className: "CS-Sem1"
                    departmentId: 1
                    departmentName: "Computer Science"
                    userId: 4
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Students
      summary: Create New Student (Admin Only)
      description: |
        Creates a new student record and automatically generates an associated login account in the `users` table with `ROLE_STUDENT` and default password `student123`.
        Enforces unique constraints on `studentId` and `email`.
        Restricted to users with role `ROLE_ADMIN`.
      operationId: createStudent
      security:
        - bearerAuth: []
      requestBody:
        description: Student demographic and academic enrollment data.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentDto'
            example:
              studentId: "STU012"
              name: "Siddharth Rao"
              email: "siddharth.rao@pillai.edu"
              phone: "+91 98200 45678"
              dateOfBirth: "2003-08-22"
              gender: "Male"
              address: "Sector 19, Kharghar, Navi Mumbai"
              classId: 1
              departmentId: 1
      responses:
        '201':
          description: Student successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStudent'
              example:
                success: true
                message: "Student created successfully"
                data:
                  id: 11
                  studentId: "STU012"
                  name: "Siddharth Rao"
                  email: "siddharth.rao@pillai.edu"
                  phone: "+91 98200 45678"
                  dateOfBirth: "2003-08-22"
                  gender: "Male"
                  address: "Sector 19, Kharghar, Navi Mumbai"
                  classId: 1
                  className: "CS-Sem1"
                  departmentId: 1
                  departmentName: "Computer Science"
                  userId: 16
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Conflict. Student ID or email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/students/{id}:
    get:
      tags:
        - Students
      summary: Get Student by Primary Key ID
      description: |
        Retrieves detailed profile information for a specific student by their internal database ID.
        Requires authenticated session.
      operationId: getStudentById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Internal database primary key ID of the student.
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Student profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStudent'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Students
      summary: Full Update of Student Profile (Admin Only)
      description: |
        Performs a full replacement update of all student attributes including demographic, contact, and enrollment data.
        Synchronizes the updated email address to the associated `users` table record.
        Restricted to `ROLE_ADMIN`.
      operationId: updateStudent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Student database primary key ID.
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        description: Complete student entity replacement payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentDto'
            example:
              studentId: "STU001"
              name: "Aarav K. Patel"
              email: "student1.updated@pillai.edu"
              phone: "+91 99000 99999"
              dateOfBirth: "2002-01-10"
              gender: "Male"
              address: "Sector 12, Vashi, Navi Mumbai, India"
              classId: 1
              departmentId: 1
      responses:
        '200':
          description: Student profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStudent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Conflict. Duplicate student ID or email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Students
      summary: Partial Update of Student Profile (Admin Only)
      description: |
        Modifies specific fields of an existing student record without overwriting unprovided fields.
        Restricted to `ROLE_ADMIN`.
      operationId: patchStudent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Student database primary key ID.
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        description: Fields to patch (e.g., updated phone or address).
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentDto'
            example:
              phone: "+91 99000 88888"
              address: "New Residential Address, Nerul, Navi Mumbai"
      responses:
        '200':
          description: Student patched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStudent'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Students
      summary: Delete Student Record (Admin Only)
      description: |
        Deletes a student record from the database.
        Cascades deletion to the associated login record in the `users` table and related attendance and exam result records.
        Restricted to `ROLE_ADMIN`.
      operationId: deleteStudent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Student database primary key ID.
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Student record and cascading relations deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
              example:
                success: true
                message: "Student deleted successfully"
                data: null
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/students/class/{classId}:
    get:
      tags:
        - Students
      summary: List Students Enrolled in a Specific Class
      description: |
        Returns all students currently assigned to the given academic cohort class ID.
        Frequently used by instructors during attendance taking and marks submission.
        Requires authenticated session.
      operationId: getStudentsByClassId
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          description: Database primary key of the academic class cohort.
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Class roster retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStudentList'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/students/me:
    get:
      tags:
        - Students
      summary: Get Logged-In Student Profile
      description: |
        Extracts the username from the calling client's JWT authentication token and fetches the student profile corresponding to that user.
        Designed for student portal personal profiles.
        Requires authenticated user with `ROLE_STUDENT`.
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Personal student profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStudent'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: No student profile found associated with the active authentication principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # 3. TEACHER CONTROLLER (/api/teachers)
  # =========================================================================
  /api/teachers:
    get:
      tags:
        - Teachers
      summary: Retrieve All Faculty Members
      description: |
        Returns a complete list of registered teachers and professors across all academic departments.
        Requires authenticated user.
      operationId: getAllTeachers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Faculty directory retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeacherList'
              example:
                success: true
                message: "Teachers retrieved successfully"
                data:
                  - id: 1
                    teacherId: "TCH001"
                    name: "Dr. Rajesh Sharma"
                    email: "dr.sharma@pillai.edu"
                    phone: "+91 98201 11223"
                    departmentId: 1
                    departmentName: "Computer Science"
                    userId: 2
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Teachers
      summary: Add New Teacher (Admin Only)
      description: |
        Creates a new faculty member profile and provisions an associated user account in `users` with `ROLE_TEACHER` and default password `teacher123`.
        Enforces unique constraints on `teacherId` and `email`.
        Restricted to `ROLE_ADMIN`.
      operationId: createTeacher
      security:
        - bearerAuth: []
      requestBody:
        description: Teacher details and departmental affiliation.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherDto'
            example:
              teacherId: "TCH003"
              name: "Dr. Suresh Patil"
              email: "dr.patil@pillai.edu"
              phone: "+91 98203 55667"
              departmentId: 1
      responses:
        '201':
          description: Teacher successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeacher'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Conflict. Teacher ID or email already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/teachers/{id}:
    get:
      tags:
        - Teachers
      summary: Get Teacher by Primary Key ID
      description: |
        Fetches teacher profile details by internal database primary key ID.
        Requires authenticated session.
      operationId: getTeacherById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Internal database ID of the teacher.
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Teacher profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeacher'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Teachers
      summary: Full Update of Teacher Profile (Admin Only)
      description: |
        Replaces all teacher attributes including departmental re-assignment and contact information.
        Synchronizes updated email to user credentials.
        Restricted to `ROLE_ADMIN`.
      operationId: updateTeacher
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Teacher database primary key ID.
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        description: Full teacher payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherDto'
            example:
              teacherId: "TCH001"
              name: "Dr. Rajesh K. Sharma"
              email: "dr.sharma@pillai.edu"
              phone: "+91 98201 99999"
              departmentId: 1
      responses:
        '200':
          description: Teacher profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeacher'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags:
        - Teachers
      summary: Partial Update of Teacher Record (Admin Only)
      description: |
        Selectively modifies non-null fields of an existing teacher record.
        Restricted to `ROLE_ADMIN`.
      operationId: patchTeacher
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Teacher database primary key ID.
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        description: Partial teacher attributes.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherDto'
            example:
              phone: "+91 98201 88888"
      responses:
        '200':
          description: Teacher patched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeacher'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Teachers
      summary: Delete Teacher Record (Admin Only)
      description: |
        Deletes a teacher from the database, removing their user account.
        Dissociates assigned subjects by setting `teacher_id` to null on subjects taught.
        Restricted to `ROLE_ADMIN`.
      operationId: deleteTeacher
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Teacher database primary key ID.
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
