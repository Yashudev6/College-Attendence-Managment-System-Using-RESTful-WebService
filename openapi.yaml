          in: path
          required: true
          description: Attendance database primary key ID.
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        description: Fields to patch.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendancePatchRequest'
            example:
              status: "PRESENT"
              remarks: "Excused medical note provided"
      responses:
        '200':
          description: Attendance status patched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAttendance'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
